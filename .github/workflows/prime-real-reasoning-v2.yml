name: Prime Real Reasoning V2

on:
  push:
    branches:
      - prime-real-reasoning-repair-v2
    paths:
      - 'prime_race/rr_runner.py'
      - 'prime_race/rr_protocol.py'
      - 'prime_race/rr_uncertainty_tasks.py'
      - '.github/workflows/prime-real-reasoning-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIME_REASONING_MODEL_ID: HuggingFaceTB/SmolLM2-360M-Instruct
      PRIME_REASONING_SEED: '0'
      PRIME_REASONING_OUT: prime_reasoning_v2_results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.46,<5' safetensors
      - name: Run frozen BASE versus repaired Prime on unseen benchmark
        run: |
          set -euo pipefail
          PYTHONPATH=prime_race python prime_race/rr_runner.py | tee prime_reasoning_v2_stdout.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: prime-real-reasoning-v2-evidence
          path: |
            prime_reasoning_v2_results/
            prime_reasoning_v2_stdout.txt
          if-no-files-found: error
