name: Finalize live news and clean V6 campaign

on:
  push:
    branches:
      - fix/final-live-news-freshness-20260908

permissions:
  contents: write

jobs:
  verify-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-live-news-freshness-20260908
          fetch-depth: 0

      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Start clean post-observation V6 campaign
        run: python backend/start_final_forward_oos_v672.py

      - name: Compile and run incident regressions
        run: |
          python -m compileall -q backend/fia backend/main.py backend/reseal_forward_oos_campaign.py
          python backend/fia/test_live_news_fallback_v672.py
          python backend/fia/test_live_degraded_incident_v670.py
          python backend/fia/test_candle_fallback_cloud.py
          python backend/fia/test_live_candle_fallback_security_v671.py
          python backend/test_reseal_refuses_any_observation_v672.py

      - name: Verify new campaign seal and zero local backfill
        run: |
          cd backend
          python - <<'PY'
          from pathlib import Path
          from fia.forward_oos import verify_campaign_seal
          v = verify_campaign_seal()
          assert v.get('ok') is True, v
          assert v.get('campaign_id') == 'CLEAR-NASDAQ-FORWARD-OOS-V6-V672', v
          events = list((Path('fia_forward_oos') / 'events').glob('*.json'))
          assert not events, events
          print('V6_SEAL=PASS')
          print('V6_FINGERPRINT=' + str((v.get('sealed_model_fingerprint') or {}).get('digest')))
          print('LOCAL_EVENTS=0')
          PY

      - name: Commit verified final source and campaign transition
        run: |
          git config user.name "CLEAR NASDAQ Final Incident Fix"
          git config user.email "clear-nasdaq@users.noreply.github.com"
          git rm -f backend/start_final_forward_oos_v672.py
          git rm -f .github/workflows/finalize-live-news-campaign-v672.yml
          git add backend/fia/providers.py backend/fia/provider_reliability.py backend/fia/test_live_news_fallback_v672.py backend/reseal_forward_oos_campaign.py backend/test_reseal_refuses_any_observation_v672.py backend/fia_forward_oos/FORWARD_OOS_CAMPAIGN_SEAL.json backend/fia_forward_oos/SEAL_ARCHIVE_20260908_171806
          git commit -m "Finalize live news freshness and start clean V6 Forward-OOS [skip ci]"
          git push origin HEAD:fix/final-live-news-freshness-20260908
