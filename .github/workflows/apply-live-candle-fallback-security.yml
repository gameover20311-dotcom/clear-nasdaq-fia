name: Apply live candle fallback and security fix

on:
  push:
    branches:
      - fix/live-candle-fallback-security-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-candle-fallback-security-20260908
          fetch-depth: 0

      - name: Install backend runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Apply exact candle fallback and log-redaction patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/fia/providers.py')
          s = p.read_text()

          old = '''        except Exception as e:\n            print(f"Provider error: {url} -> {e}")\n            return None\n'''
          new = '''        except Exception as e:\n            # SECURITY: never stringify provider exceptions here. httpx embeds the\n            # fully-expanded request URL in HTTPStatusError, including query-string\n            # credentials such as Finnhub token=... and Polygon apiKey=....\n            # Log only scheme/host/path plus status/type; never query parameters.\n            try:\n                from urllib.parse import urlsplit\n                parts = urlsplit(str(url))\n                safe_url = f"{parts.scheme}://{parts.netloc}{parts.path}"\n            except Exception:\n                safe_url = "<provider-url-redacted>"\n\n            status = None\n            if isinstance(e, httpx.HTTPStatusError) and getattr(e, "response", None) is not None:\n                status = getattr(e.response, "status_code", None)\n            if status is not None:\n                print(f"Provider error: {safe_url} -> HTTP {status} ({type(e).__name__})")\n            else:\n                print(f"Provider error: {safe_url} -> {type(e).__name__}")\n            return None\n'''
          if old not in s:
              raise SystemExit('generic HTTP error block not found exactly')
          s = s.replace(old, new, 1)

          start = s.index('    async def finnhub_candles(')
          end_marker = '    # =========================================================\n    # FRED\n'
          end = s.index(end_marker, start)

          replacement = r'''    async def _yahoo_chart_candles(
        self,
        symbol: str,
        resolution: str,
        start_ts: int,
        end_ts: int,
    ):
        """Keyless Yahoo chart fallback, normalized to Finnhub candle shape.

        This is a live fallback only. Timestamps remain provider aggregate-window
        START timestamps; completed_bar_structure() remains the single authority
        that rejects a still-forming final bar before any structure score is used.
        """
        from urllib.parse import quote

        interval_map = {
            "D": "1d",
            "5": "5m", "5m": "5m",
            "15": "15m", "15m": "15m",
            "30": "30m", "30m": "30m",
            "60": "60m", "60m": "60m",
        }
        interval = interval_map.get(str(resolution))
        if not interval:
            return None

        url = f"https://query1.finance.yahoo.com/v8/finance/chart/{quote(str(symbol), safe='')}"
        payload = await self.get(
            url,
            {
                "period1": int(start_ts),
                "period2": int(end_ts) + 60,
                "interval": interval,
                "includePrePost": "true",
                "events": "div,splits",
            },
            timeout=15,
            headers={"User-Agent": "Mozilla/5.0"},
        )
        if not isinstance(payload, dict):
            return None

        chart = payload.get("chart") or {}
        if chart.get("error"):
            return None
        results = chart.get("result") or []
        if not results or not isinstance(results[0], dict):
            return None
        result = results[0]
        stamps = list(result.get("timestamp") or [])
        indicators = result.get("indicators") or {}
        quotes = indicators.get("quote") or []
        if not stamps or not quotes or not isinstance(quotes[0], dict):
            return None
        q = quotes[0]
        closes_raw = list(q.get("close") or [])
        highs_raw = list(q.get("high") or [])
        lows_raw = list(q.get("low") or [])
        opens_raw = list(q.get("open") or [])
        volumes_raw = list(q.get("volume") or [])

        timestamps, highs, lows, closes, opens, volumes = [], [], [], [], [], []
        for i, ts in enumerate(stamps):
            try:
                close = closes_raw[i] if i < len(closes_raw) else None
                if ts is None or close is None:
                    continue
                close_f = float(close)
                high = highs_raw[i] if i < len(highs_raw) else None
                low = lows_raw[i] if i < len(lows_raw) else None
                open_ = opens_raw[i] if i < len(opens_raw) else None
                volume = volumes_raw[i] if i < len(volumes_raw) else None
                timestamps.append(int(ts))
                highs.append(float(high) if high is not None else close_f)
                lows.append(float(low) if low is not None else close_f)
                closes.append(close_f)
                opens.append(float(open_) if open_ is not None else close_f)
                volumes.append(float(volume) if volume is not None else 0.0)
            except (TypeError, ValueError, OverflowError, IndexError):
                continue

        if not timestamps:
            return None
        return {
            "s": "ok",
            "t": timestamps,
            "h": highs,
            "l": lows,
            "c": closes,
            "o": opens,
            "v": volumes,
            "_fia_candle_source": "yahoo_chart_fallback",
        }

    @staticmethod
    def _latest_candle_start(payload):
        if not isinstance(payload, dict):
            return None
        vals = []
        for x in payload.get("t") or []:
            try:
                vals.append(int(x))
            except (TypeError, ValueError, OverflowError):
                pass
        return max(vals) if vals else None

    async def finnhub_candles(
        self,
        symbol: str,
        resolution: str,
        start_ts: int,
        end_ts: int,
    ):
        """Return the freshest real candle series from the configured live paths.

        Order is not enough: a provider can return a syntactically valid but stale
        series. Finnhub remains primary when it succeeds. If it fails, Polygon and
        keyless Yahoo Chart are both evaluated and the series with the newest
        provider bar-start timestamp wins. Downstream completed-bar logic still
        rejects any forming row, so freshness cannot create future-bar leakage.
        """
        key = self.keys["FINNHUB_API_KEY"]

        if key:
            candles = await self.get(
                "https://" + "finnhub.io/api/v1/stock/candle",
                {
                    "symbol": symbol,
                    "resolution": resolution,
                    "from": start_ts,
                    "to": end_ts,
                    "token": key,
                },
                timeout=15,
            )
            if isinstance(candles, dict) and candles.get("s") == "ok":
                candles.setdefault("_fia_candle_source", "finnhub")
                self._candle_failure = None
                return candles
            print(f"Finnhub candles unavailable for {symbol} ({resolution}); trying fallbacks.")
            self._candle_failure = {
                "stage": "finnhub", "symbol": symbol, "resolution": str(resolution),
                "reason": "FINNHUB_CANDLES_UNAVAILABLE",
            }

        polygon_payload = None
        polygon_key = self.keys["POLYGON_API_KEY"]
        if polygon_key:
            resolution_map = {
                "D": ("1", "day"),
                "5": ("5", "minute"), "5m": ("5", "minute"),
                "15": ("15", "minute"), "15m": ("15", "minute"),
                "30": ("30", "minute"), "30m": ("30", "minute"),
                "60": ("60", "minute"), "60m": ("60", "minute"),
            }
            multiplier, timespan = resolution_map.get(str(resolution), ("1", "day"))
            start_date = datetime.utcfromtimestamp(int(start_ts)).strftime("%Y-%m-%d")
            end_date = datetime.utcfromtimestamp(int(end_ts)).strftime("%Y-%m-%d")
            polygon_url = (
                f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/"
                f"{multiplier}/{timespan}/{start_date}/{end_date}"
            )
            polygon = await self.get(
                polygon_url,
                {"adjusted": "true", "sort": "asc", "limit": 50000, "apiKey": polygon_key},
                timeout=15,
            )
            results = (polygon.get("results") or []) if isinstance(polygon, dict) else []
            if results:
                timestamps, highs, lows, closes, opens, volumes = [], [], [], [], [], []
                for row in results:
                    try:
                        ts_ms, high, low, close = row.get("t"), row.get("h"), row.get("l"), row.get("c")
                        open_ = row.get("o")
                        if ts_ms is None or high is None or low is None or close is None:
                            continue
                        timestamps.append(int(ts_ms) // 1000)
                        highs.append(float(high)); lows.append(float(low)); closes.append(float(close))
                        opens.append(float(open_) if open_ is not None else float(close))
                        try:
                            volumes.append(float(row.get("v") or 0.0))
                        except (TypeError, ValueError):
                            volumes.append(0.0)
                    except (TypeError, ValueError, OverflowError, AttributeError):
                        continue
                if timestamps:
                    polygon_payload = {
                        "s": "ok", "t": timestamps, "h": highs, "l": lows,
                        "c": closes, "o": opens, "v": volumes,
                        "_fia_candle_source": "polygon_fallback",
                    }
                    print(f"Polygon fallback available for {symbol} ({resolution}): {len(timestamps)} candles.")
            if polygon_payload is None:
                print(f"Polygon fallback returned no usable candles for {symbol} ({resolution}).")
        else:
            print("Polygon fallback unavailable: POLYGON_API_KEY is missing.")

        yahoo_payload = await self._yahoo_chart_candles(symbol, resolution, start_ts, end_ts)
        if isinstance(yahoo_payload, dict):
            print(f"Yahoo chart fallback available for {symbol} ({resolution}): {len(yahoo_payload.get('t') or [])} candles.")

        p_latest = self._latest_candle_start(polygon_payload)
        y_latest = self._latest_candle_start(yahoo_payload)
        chosen = None
        if y_latest is not None and (p_latest is None or y_latest > p_latest):
            chosen = yahoo_payload
        elif p_latest is not None:
            chosen = polygon_payload
        elif y_latest is not None:
            chosen = yahoo_payload

        if isinstance(chosen, dict):
            self._candle_failure = None
            print(
                f"Candle fallback selected for {symbol} ({resolution}): "
                f"{chosen.get('_fia_candle_source')} latest_start={self._latest_candle_start(chosen)}"
            )
            return chosen

        self._candle_failure = {
            "stage": "fallbacks", "symbol": symbol, "resolution": str(resolution),
            "reason": "NO_USABLE_CANDLE_PROVIDER",
            "remediation": "Finnhub, Polygon and Yahoo Chart returned no usable candle series.",
        }
        return None

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          pr = Path('backend/fia/provider_reliability.py')
          r = pr.read_text()
          old_label = 'source="Finnhub candles + Polygon fallback"'
          new_label = 'source="Finnhub candles + Polygon/Yahoo fallback"'
          if old_label not in r:
              raise SystemExit('provider health candle source label not found')
          pr.write_text(r.replace(old_label, new_label, 1))

          test = Path('backend/fia/test_live_candle_fallback_security_v671.py')
          test.write_text(r'''"""Regression for live candle fallback freshness and provider-log credential redaction."""
from __future__ import annotations

import asyncio
import io
import sys
import time
from contextlib import redirect_stdout
from pathlib import Path
from unittest.mock import patch

BACKEND = Path(__file__).resolve().parent.parent
if str(BACKEND) not in sys.path:
    sys.path.insert(0, str(BACKEND))

import httpx
from fia.providers import ProviderHub

FAIL = []
def check(name, cond, detail=""):
    print(("  PASS " if cond else "  FAIL ") + name + ((" " + str(detail)) if detail and not cond else ""))
    if not cond: FAIL.append(name)

print("[A] provider HTTP errors never print query-string secrets")
secret = "TOP_SECRET_FINNHUB_TOKEN_123"
req = httpx.Request("GET", "https://finnhub.io/api/v1/stock/candle?symbol=QQQ&token=" + secret)
resp = httpx.Response(403, request=req)
class FakeClient:
    def __init__(self, *a, **k): pass
    async def __aenter__(self): return self
    async def __aexit__(self, *a): return False
    async def get(self, *a, **k): return resp
buf = io.StringIO()
with patch("fia.providers.httpx.AsyncClient", FakeClient), redirect_stdout(buf):
    got = asyncio.run(ProviderHub().get("https://finnhub.io/api/v1/stock/candle", {"token": secret}))
out = buf.getvalue()
check("request failed closed", got is None)
check("secret absent from log", secret not in out, out)
check("query key absent from log", "token=" not in out.lower(), out)
check("status retained for diagnosis", "HTTP 403" in out, out)

print("[B] fresher Yahoo series beats stale-but-valid Polygon series")
now = int(time.time())
class DeterministicHub(ProviderHub):
    def __init__(self):
        super().__init__()
        self.keys["FINNHUB_API_KEY"] = "x"
        self.keys["POLYGON_API_KEY"] = "y"
    async def get(self, url, params=None, timeout=10, headers=None):
        if "finnhub.io" in url:
            return None
        if "polygon.io" in url:
            rows=[]
            for i in range(12):
                ts=(now - (15-i)*3600)*1000
                rows.append({"t":ts,"o":100+i,"h":102+i,"l":99+i,"c":101+i,"v":1000})
            return {"results":rows}
        if "query1.finance.yahoo.com" in url:
            stamps=[now-(12-i)*3600 for i in range(13)]
            q={"open":[200+i for i in range(13)],"high":[202+i for i in range(13)],"low":[199+i for i in range(13)],"close":[201+i for i in range(13)],"volume":[2000]*13}
            return {"chart":{"result":[{"timestamp":stamps,"indicators":{"quote":[q]}}],"error":None}}
        return None
hub=DeterministicHub()
c=asyncio.run(hub.finnhub_candles("QQQ","60",now-86400,now))
check("Yahoo chosen by newest bar timestamp", c.get("_fia_candle_source")=="yahoo_chart_fallback", c.get("_fia_candle_source"))

print("[C] older Yahoo never displaces fresher Polygon")
class PolygonNewerHub(DeterministicHub):
    async def get(self, url, params=None, timeout=10, headers=None):
        if "finnhub.io" in url: return None
        if "polygon.io" in url:
            return {"results":[{"t":(now-1800)*1000,"o":1,"h":2,"l":0.5,"c":1.5,"v":10}]}
        if "query1.finance.yahoo.com" in url:
            q={"open":[1],"high":[2],"low":[0.5],"close":[1.5],"volume":[10]}
            return {"chart":{"result":[{"timestamp":[now-7200],"indicators":{"quote":[q]}}],"error":None}}
        return None
c2=asyncio.run(PolygonNewerHub().finnhub_candles("QQQ","60",now-86400,now))
check("Polygon retained when newer", c2.get("_fia_candle_source")=="polygon_fallback", c2.get("_fia_candle_source"))

print("[D] downstream completed-bar gate still excludes a forming Yahoo row")
last_forming_start=now-20*60
stamps=[last_forming_start-(12-i)*3600 for i in range(13)]
closes=[300+i for i in range(13)]
payload={"s":"ok","t":stamps,"c":closes,"o":closes,"h":[x+1 for x in closes],"l":[x-1 for x in closes],"v":[100]*13,"_fia_candle_source":"yahoo_chart_fallback"}
class PayloadHub(ProviderHub):
    async def finnhub_candles(self,*a,**k): return payload
st=asyncio.run(PayloadHub().completed_bar_structure("QQQ","60"))
check("forming final row excluded", st.get("completed_bars")==12, st.get("completed_bars"))
check("source provenance preserved", st.get("source")=="yahoo_chart_fallback", st.get("source"))

if FAIL:
    print("FAILED", FAIL)
    raise SystemExit(1)
print("ALL LIVE CANDLE FALLBACK / SECURITY REGRESSIONS PASSED")
''')
          PY

      - name: Compile and run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/fia backend/main.py
          python backend/fia/test_live_degraded_incident_v670.py
          python backend/fia/test_candle_fallback_cloud.py
          python backend/fia/test_live_candle_fallback_security_v671.py

      - name: Probe keyless Yahoo chart path from CI
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python - <<'PY'
          import asyncio, time
          from fia.providers import ProviderHub
          h=ProviderHub()
          h.keys['FINNHUB_API_KEY']=''
          h.keys['POLYGON_API_KEY']=''
          now=int(time.time())
          c=asyncio.run(h.finnhub_candles('QQQ','60',now-3*86400,now))
          if not isinstance(c,dict) or c.get('_fia_candle_source')!='yahoo_chart_fallback':
              raise SystemExit('Yahoo live fallback probe failed')
          ts=max(int(x) for x in c.get('t') or [])
          print('YAHOO_LIVE_PROBE=PASS source=%s bars=%d latest_start_age_s=%d' % (c.get('_fia_candle_source'),len(c.get('t') or []),now-ts))
          PY

      - name: Re-seal zero-observation Forward-OOS against corrected source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find backend/fia_forward_oos/events -type f -name '*forecast-lock*.json' 2>/dev/null | wc -l)" -eq 0
          cd backend
          python reseal_forward_oos_campaign.py

      - name: Commit verified fix and reseal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CLEAR NASDAQ Incident Fix"
          git config user.email "clear-nasdaq@users.noreply.github.com"
          git add backend/fia/providers.py backend/fia/provider_reliability.py backend/fia/test_live_candle_fallback_security_v671.py backend/fia_forward_oos/FORWARD_OOS_CAMPAIGN_SEAL.json backend/fia_forward_oos/SEAL_ARCHIVE_*
          git commit -m "Add freshest candle fallback and redact provider credentials"
          git push origin HEAD:fix/live-candle-fallback-security-20260908
