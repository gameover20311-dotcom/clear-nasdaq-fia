name: Apply live candle fallback and security fix

on:
  push:
    branches:
      - fix/live-candle-fallback-security-20260908

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-candle-fallback-security-20260908
          fetch-depth: 0

      - name: Install backend runtime dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Fix one-shot patcher label matcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/apply_live_candle_fallback_security_patch.py')
          s = p.read_text()
          old = '''old_label = 'source="Finnhub candles + Polygon fallback"'\nnew_label = 'source="Finnhub candles + Polygon/Yahoo fallback"'\nif old_label not in r:\n    raise SystemExit('provider health candle source label not found')\nreliability.write_text(r.replace(old_label, new_label, 1))'''
          new = '''old_label = "Finnhub candles + Polygon fallback"\nnew_label = "Finnhub candles + Polygon/Yahoo fallback"\nif old_label not in r:\n    raise SystemExit('provider health candle source label not found')\nr = r.replace(old_label, new_label)\nr = r.replace("exact upstream may be Finnhub or Polygon fallback.", "exact upstream may be Finnhub, Polygon or Yahoo fallback.")\nreliability.write_text(r)'''
          if old not in s:
              raise SystemExit('staging patcher tail did not match')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply exact source patch
        run: python backend/apply_live_candle_fallback_security_patch.py

      - name: Compile and run targeted regressions
        run: |
          python -m compileall -q backend/fia backend/main.py
          python backend/fia/test_live_degraded_incident_v670.py
          python backend/fia/test_candle_fallback_cloud.py
          python backend/fia/test_live_candle_fallback_security_v671.py

      - name: Probe keyless Yahoo chart path from CI
        run: |
          cd backend
          python - <<'PY'
          import asyncio, time
          from fia.providers import ProviderHub
          h = ProviderHub()
          h.keys['FINNHUB_API_KEY'] = ''
          h.keys['POLYGON_API_KEY'] = ''
          now = int(time.time())
          c = asyncio.run(h.finnhub_candles('QQQ', '60', now - 3 * 86400, now))
          if not isinstance(c, dict) or c.get('_fia_candle_source') != 'yahoo_chart_fallback':
              raise SystemExit('Yahoo live fallback probe failed')
          ts = max(int(x) for x in c.get('t') or [])
          print('YAHOO_LIVE_PROBE=PASS source=%s bars=%d latest_start_age_s=%d' % (
              c.get('_fia_candle_source'), len(c.get('t') or []), now - ts))
          PY

      - name: Re-seal zero-observation Forward-OOS against corrected source
        run: |
          test "$(find backend/fia_forward_oos/events -type f -name '*forecast-lock*.json' 2>/dev/null | wc -l)" -eq 0
          cd backend
          python reseal_forward_oos_campaign.py

      - name: Commit verified fix and clean staging files
        run: |
          git config user.name "CLEAR NASDAQ Incident Fix"
          git config user.email "clear-nasdaq@users.noreply.github.com"
          git rm backend/apply_live_candle_fallback_security_patch.py
          git rm .github/workflows/apply-live-candle-fallback-security.yml
          git add backend/fia/providers.py backend/fia/provider_reliability.py backend/fia_forward_oos/FORWARD_OOS_CAMPAIGN_SEAL.json backend/fia_forward_oos/SEAL_ARCHIVE_*
          git commit -m "Add freshest candle fallback and redact provider credentials"
          git push origin HEAD:fix/live-candle-fallback-security-20260908
