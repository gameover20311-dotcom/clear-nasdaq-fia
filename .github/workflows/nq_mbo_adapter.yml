name: NQ MBO adapter contract

on:
  pull_request:
    paths:
      - 'backend/nq_mbo_adapter/**'
      - '.github/workflows/nq_mbo_adapter.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provider-neutral MBO contract tests
        run: python -m unittest discover -v -s nq_mbo_adapter/tests -p 'test_*.py'
      - name: Prove BASE scientific identities are unchanged
        run: |
          python - <<'PY'
          from fia.identity import all_fingerprints
          expected = {
              'model': 'ee7ede6c0db89266e2383baf3bdb87775251df80323bea4c3bea756a186d8eee',
              'protocol': 'd0b52e47ec576784ce3f42c9e02f187eb094a4ee23af3ffa37e26f82a03e42ce',
              'infrastructure': '4a114cf7b9b3df738a83b2986c1d4ccb1cfd8c05f7e3fc248248dc9aa7f294a1',
          }
          current = all_fingerprints()
          for key, digest in expected.items():
              if current[key]['digest'] != digest:
                  raise SystemExit(f'BASE_IDENTITY_MOVED:{key}:{current[key]["digest"]}')
          print('BASE_FIA_IDENTITIES_UNCHANGED')
          PY
      - name: Prove DPCSE remains NOT_ARMED and N=0
        run: |
          python - <<'PY'
          from dpcse_v23_shadow.campaign import bootstrap_manifest
          m = bootstrap_manifest()
          assert m['status'] == 'NOT_ARMED'
          assert m['candidate_model'] is None
          assert m['locked_rows'] == 0 and m['resolved_rows'] == 0
          assert m['pilot_alpha'] == 0.0
          assert m['historical_backfill'] == 'FORBIDDEN'
          print('DPCSE_V23_STILL_NOT_ARMED_N0')
          PY
