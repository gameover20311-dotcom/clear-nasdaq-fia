name: Simons Shadow Lab V1

on:
  pull_request:
    paths:
      - 'backend/research/**'
      - 'backend/tests/test_simons_shadow_lab_v1.py'
      - '.github/workflows/simons-shadow-lab-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research package
        run: python -m py_compile backend/research/simons_shadow_lab/__init__.py backend/research/simons_shadow_lab/lab.py backend/tests/test_simons_shadow_lab_v1.py
      - name: Run isolated adversarial suite
        run: python backend/tests/test_simons_shadow_lab_v1.py -v
