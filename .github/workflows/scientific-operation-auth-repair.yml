name: Scientific operation auth repair

on:
  push:
    branches:
      - fix/scientific-operation-auth-20260914

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture pre-repair identities
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from fia.identity import all_fingerprints
          d=all_fingerprints()
          out={k:d[k]['digest'] for k in ('model','protocol','infrastructure')}
          print('PRE_IDENTITIES', json.dumps(out, sort_keys=True))
          json.dump(out, open('/tmp/pre_identities.json','w'))
          PY

      - name: Apply one scientific-operation boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return False
              if old not in s:
                  raise SystemExit(f'locator not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))
              return True

          def replace_block(path, start, end, new):
              p=Path(path); s=p.read_text()
              if new.strip() in s:
                  return False
              a=s.find(start)
              if a < 0:
                  raise SystemExit(f'start locator not found in {path}: {start}')
              b=s.find(end,a+len(start)) if end is not None else len(s)
              if b < 0:
                  raise SystemExit(f'end locator not found in {path}: {end}')
              p.write_text(s[:a] + new.rstrip() + '\n\n\n' + s[b:])
              return True

          # 1) Reuse auth_api.py (already INFRASTRUCTURE-classified) so no new
          # fingerprint-scope module or classification change is introduced.
          auth=Path('backend/fia/auth_api.py')
          s=auth.read_text()
          marker='def install_auth_routes(app) -> None:'
          helper='''SCIENTIFIC_OPERATION_ENV = "FIA_SCIENTIFIC_OPERATION_SECRET"\nSCIENTIFIC_OPERATION_HEADER = "x-fia-scientific-operation"\n\n\ndef scientific_operation_authorized(request: Any, *, required: bool = True) -> bool:\n    """Authorize scientific state mutation with a server-only credential.\n\n    A normal membership/session token is intentionally unrelated to this\n    boundary. Optional callers remain read-only when the header is absent.\n    Secrets are never returned or logged.\n    """\n    supplied = str(getattr(request, "headers", {}).get(SCIENTIFIC_OPERATION_HEADER, "") or "").strip()\n    configured = str(os.getenv(SCIENTIFIC_OPERATION_ENV) or "").strip()\n    if not supplied:\n        if required:\n            raise HTTPException(status_code=403, detail="SCIENTIFIC_OPERATION_AUTH_REQUIRED")\n        return False\n    if len(configured) < 32:\n        raise HTTPException(status_code=503, detail="SCIENTIFIC_OPERATION_AUTH_NOT_CONFIGURED")\n    if not hmac.compare_digest(supplied.encode("utf-8"), configured.encode("utf-8")):\n        raise HTTPException(status_code=403, detail="SCIENTIFIC_OPERATION_AUTH_FAILED")\n    return True\n\n\n'''
          if 'def scientific_operation_authorized(' not in s:
              if marker not in s: raise SystemExit('auth install locator missing')
              auth.write_text(s.replace(marker, helper+marker, 1))

          # 2) Main HTTP surface: analytical/read routes stay usable, but their
          # historical/scientific persistence side effects occur only with the
          # dedicated server-side credential. Explicit resolve requires it.
          replace_once('backend/main.py',
              'from fastapi import FastAPI, UploadFile, File, HTTPException, Form',
              'from fastapi import FastAPI, UploadFile, File, HTTPException, Form, Request')
          replace_once('backend/main.py',
              'from fia.three_way_confluence import build_three_way_confluence\n',
              'from fia.three_way_confluence import build_three_way_confluence\nfrom fia.auth_api import scientific_operation_authorized\n')

          replace_block('backend/main.py','@app.get("/api/forecast")','@app.get("/api/liquidity")','''@app.get("/api/forecast")\nasync def forecast(request: Request):\n    snapshot_data = await hub.snapshot()\n    fia_forecast = build_forecast(snapshot_data)\n    scientific_write = scientific_operation_authorized(request, required=False)\n\n    if scientific_write:\n        # Scientific/history persistence is an explicit privileged side effect.\n        try:\n            snapshot_payload = snapshot_data.get("data", {})\n            nq_price = snapshot_payload.get("nq_futures_price")\n            record_fia_forecast(\n                fia_forecast, entry_price=nq_price,\n                output_path="fia_backtest_phase14/data/historical_predictions.csv",\n            )\n        except Exception as exc:\n            print("Prediction recorder ERROR:", type(exc).__name__)\n\n        try:\n            phase26_accuracy = build_accuracy_assessment(fia_forecast, snapshot_data)\n            record_forward_forecast(fia_forecast, snapshot_data, phase26_accuracy)\n            asyncio.create_task(resolve_due_forward_records())\n        except Exception as exc:\n            print("Phase26 forward recorder ERROR:", type(exc).__name__)\n\n    return fia_forecast''')

          replace_block('backend/main.py','@app.post("/api/confluence")','@app.get("/api/learning/status")','''@app.post("/api/confluence")\nasync def confluence(request: ConfluenceRequest, http_request: Request):\n    snapshot_data = await hub.snapshot()\n    fia_forecast = build_forecast(snapshot_data)\n    accuracy_assessment = build_accuracy_assessment(fia_forecast, snapshot_data)\n    assessment = build_confluence_assessment(\n        fia_forecast, accuracy_assessment, request.chart_analysis, snapshot_data,\n    )\n\n    scientific_write = scientific_operation_authorized(http_request, required=False)\n    if scientific_write:\n        try:\n            rec = record_forward_forecast(fia_forecast, snapshot_data, accuracy_assessment)\n            if rec.get("ok") and rec.get("prediction_id"):\n                linked = attach_confluence(rec["prediction_id"], assessment, accuracy_assessment)\n                assessment["research_alert"] = linked.get("alert") or build_research_alert(accuracy_assessment, assessment)\n            else:\n                assessment["research_alert"] = build_research_alert(accuracy_assessment, assessment)\n            asyncio.create_task(resolve_due_forward_records())\n        except Exception as exc:\n            assessment["research_alert"] = build_research_alert(accuracy_assessment, assessment)\n            assessment["phase26_warning"] = "Forward learning attachment unavailable: %s" % type(exc).__name__\n    else:\n        assessment["research_alert"] = build_research_alert(accuracy_assessment, assessment)\n    return assessment''')

          replace_block('backend/main.py','@app.get("/api/learning/status")','@app.post("/api/analysis/compare")','''@app.get("/api/learning/status")\nasync def learning_status():\n    # Strictly read-only. Resolution is an explicit scientific operation.\n    return build_learning_status()\n\n\n@app.post("/api/learning/resolve")\nasync def learning_resolve(request: Request):\n    scientific_operation_authorized(request, required=True)\n    changed = await resolve_due_forward_records()\n    payload = build_learning_status()\n    payload["resolved_fields_updated"] = changed\n    return payload''')

          replace_block('backend/main.py','@app.get("/api/cognitive/forecast")','@app.get("/api/cognitive/status")','''@app.get("/api/cognitive/forecast")\nasync def cognitive_forecast(request: Request, deep: bool = False, horizon: str = "8h"):\n    horizon = str(horizon or "8h").lower()\n    if horizon not in {"4h", "8h"}:\n        raise HTTPException(status_code=400, detail="horizon must be 4h or 8h")\n    snapshot_data = await hub.snapshot()\n    fia_forecast = build_forecast(snapshot_data)\n    persist = scientific_operation_authorized(request, required=False)\n    if deep:\n        return await build_deep_cognitive_report(\n            hub, snapshot_data, fia_forecast, horizon=horizon, persist=persist\n        )\n    return build_cognitive_report(\n        snapshot_data, fia_forecast, horizon=horizon, persist=persist\n    )''')

          # 3) Other live GET analysis surfaces were silently recording research
          # ledgers. They now default read-only; only the same scientific header
          # may enable persistence.
          replace_once('backend/fia/premove_api.py','from typing import Any\n','from typing import Any\nfrom fastapi import Request\nfrom .auth_api import scientific_operation_authorized\n')
          replace_once('backend/fia/premove_api.py','async def fia_premove():\n            snapshot = await hub.snapshot()\n            forecast = build_forecast(snapshot)\n            return analyze_premove(forecast, snapshot, record=True)',
                       'async def fia_premove(request: Request):\n            snapshot = await hub.snapshot()\n            forecast = build_forecast(snapshot)\n            record = scientific_operation_authorized(request, required=False)\n            return analyze_premove(forecast, snapshot, record=record)')

          replace_once('backend/fia/premove_max_api.py','from typing import Any\n','from typing import Any\nfrom fastapi import Request\nfrom .auth_api import scientific_operation_authorized\n')
          replace_once('backend/fia/premove_max_api.py','async def fia_premove_max():\n            snapshot = await hub.snapshot()\n            forecast = build_forecast(snapshot)\n            return analyze_premove_max(forecast, snapshot, record=True)',
                       'async def fia_premove_max(request: Request):\n            snapshot = await hub.snapshot()\n            forecast = build_forecast(snapshot)\n            record = scientific_operation_authorized(request, required=False)\n            return analyze_premove_max(forecast, snapshot, record=record)')

          replace_once('backend/fia/phase33_api.py','from typing import Any\n','from typing import Any\nfrom fastapi import Request\nfrom .auth_api import scientific_operation_authorized\n')
          replace_once('backend/fia/phase33_api.py','async def phase33_live():\n            snap=await hub.snapshot(); fc=build_forecast(snap); return analyze_phase33(fc,snap,record=True)',
                       'async def phase33_live(request: Request):\n            snap=await hub.snapshot(); fc=build_forecast(snap); record=scientific_operation_authorized(request, required=False); return analyze_phase33(fc,snap,record=record)')

          replace_once('backend/fia/phase34_api.py','from typing import Any\n','from typing import Any\nfrom fastapi import Request\nfrom .auth_api import scientific_operation_authorized\n')
          replace_once('backend/fia/phase34_api.py','async def live():\n            s=await hub.snapshot(); f=build_forecast(s); return analyze_phase34(f,s,True)',
                       'async def live(request: Request):\n            s=await hub.snapshot(); f=build_forecast(s); record=scientific_operation_authorized(request, required=False); return analyze_phase34(f,s,record)')

          # 4) Forward-OOS HTTP mutation entry points use the same boundary.
          replace_once('backend/fia/forward_oos_api.py','from fastapi import Body, Header, HTTPException','from fastapi import Body, Header, HTTPException, Request')
          replace_once('backend/fia/forward_oos_api.py','from .forward_oos import (','from .auth_api import scientific_operation_authorized\n\nfrom .forward_oos import (')
          replace_once('backend/fia/forward_oos_api.py','async def forward_oos_durability_fixture(\n        marker: str = Body(..., embed=True),',
                       'async def forward_oos_durability_fixture(\n        request: Request,\n        marker: str = Body(..., embed=True),')
          replace_once('backend/fia/forward_oos_api.py','        clean = "".join(ch for ch in str(marker) if ch.isalnum() or ch in "-_")[:64]\n        if not clean:',
                       '        scientific_operation_authorized(request, required=True)\n        clean = "".join(ch for ch in str(marker) if ch.isalnum() or ch in "-_")[:64]\n        if not clean:')
          replace_once('backend/fia/forward_oos_api.py','async def forward_oos_durability_fixture_delete(\n        marker: str, authorization: Optional[str] = Header(default=None),',
                       'async def forward_oos_durability_fixture_delete(\n        marker: str, request: Request, authorization: Optional[str] = Header(default=None),')
          # The delete route has a second identical clean= line; insert the gate
          # specifically after its auth block using a bounded block replacement.
          p=Path('backend/fia/forward_oos_api.py'); s=p.read_text()
          delete_start=s.index('@app.delete("/api/forward-oos/durability/test-fixture/{marker}")')
          run_start=s.index('@app.post("/api/forward-oos/run-once")', delete_start)
          block=s[delete_start:run_start]
          if 'scientific_operation_authorized(request, required=True)' not in block:
              needle='        except Exception as exc:\n            raise HTTPException(status_code=401, detail="AUTH_REQUIRED") from exc\n'
              if needle not in block: raise SystemExit('delete auth locator missing')
              block=block.replace(needle, needle+'        scientific_operation_authorized(request, required=True)\n',1)
              p.write_text(s[:delete_start]+block+s[run_start:])
          replace_once('backend/fia/forward_oos_api.py','async def forward_oos_run_once():\n        # Manual invocation does NOT bypass the live checkpoint',
                       'async def forward_oos_run_once(request: Request):\n        scientific_operation_authorized(request, required=True)\n        # Manual invocation does NOT bypass the live checkpoint')

          # 5) Final cockpit Phase25/26 mutation is also browser-triggerable.
          replace_once('backend/fia_final_cockpit/api.py','from fastapi import Body, HTTPException, Header','from fastapi import Body, HTTPException, Header, Request')
          replace_once('backend/fia_final_cockpit/api.py','from fastapi import Body, HTTPException, Header, Request\n','from fastapi import Body, HTTPException, Header, Request\nfrom fia.auth_api import scientific_operation_authorized\n')
          replace_block('backend/fia_final_cockpit/api.py',"    @app.post('/api/final/confluence/three-way')",None,'''    @app.post('/api/final/confluence/three-way')\n    async def final_three_way_confluence(http_request: Request, request: Dict[str,Any]=Body(...)):\n        try:\n            from fia.accuracy_engine import build_accuracy_assessment\n            from fia.confluence_engine import build_confluence_assessment\n            from fia.three_way_confluence import build_three_way_confluence\n            from fia.learning_engine import record_forward_forecast, attach_confluence, build_research_alert, resolve_due_forward_records\n            user_analysis=request.get('user_analysis') if isinstance(request.get('user_analysis'),dict) else {}\n            vision_analysis=request.get('vision_analysis') if isinstance(request.get('vision_analysis'),dict) else {}\n            snapshot_data=await hub.snapshot(); fia_forecast=build_forecast(snapshot_data); accuracy=build_accuracy_assessment(fia_forecast,snapshot_data)\n            phase25=build_confluence_assessment(fia_forecast,accuracy,vision_analysis,snapshot_data)\n            result=build_three_way_confluence(fia_forecast,user_analysis,vision_analysis,phase25); result['phase25']=phase25\n            scientific_write=scientific_operation_authorized(http_request, required=False)\n            if scientific_write:\n                try:\n                    rec=record_forward_forecast(fia_forecast,snapshot_data,accuracy)\n                    if rec.get('ok') and rec.get('prediction_id'):\n                        linked=attach_confluence(rec['prediction_id'],phase25,accuracy)\n                        phase25['research_alert']=linked.get('alert') or build_research_alert(accuracy,phase25)\n                        result['phase26_prediction_id']=rec['prediction_id']; result['phase26_attached']=bool(linked.get('ok'))\n                    else:\n                        phase25['research_alert']=build_research_alert(accuracy,phase25); result['phase26_attached']=False\n                    asyncio.create_task(resolve_due_forward_records())\n                except Exception as exc:\n                    phase25['research_alert']=build_research_alert(accuracy,phase25); result['phase26_attached']=False; result['phase26_warning']=type(exc).__name__\n                _alert=phase25.get('research_alert') or 'NONE'\n                _alert_level=str((_alert.get('level') if isinstance(_alert,dict) else _alert) or 'NONE')\n                cache={'recorded_at_utc':datetime.now(timezone.utc).isoformat(),'setup_grade':phase25.get('setup_grade'),'confluence_score':phase25.get('confluence_score'),'confluence_alignment':phase25.get('confluence_alignment'),'confluence_completeness':phase25.get('confluence_completeness'),'research_alert':_alert,'research_alert_level':_alert_level,'phase26_prediction_id':result.get('phase26_prediction_id'),'phase26_attached':bool(result.get('phase26_attached')),'research_eligible':phase25.get('research_eligible')}\n                _atomic_write_json(_phase25_cache_path(root),cache)\n                result['dashboard_phase25_persisted']=True\n            else:\n                phase25['research_alert']=build_research_alert(accuracy,phase25)\n                result['phase26_attached']=False\n                result['dashboard_phase25_persisted']=False\n            return result\n        except HTTPException:\n            raise\n        except Exception as exc:\n            raise HTTPException(status_code=500,detail=type(exc).__name__) from exc''')

          # Regression tests live outside backend/fia fingerprint scope.
          tests=Path('backend/tests'); tests.mkdir(exist_ok=True)
          test_file=tests/'test_scientific_operation_auth.py'
          test_file.write_text(r'''import contextlib\nimport io\nimport os\nimport tempfile\nimport unittest\n\nfrom fastapi.testclient import TestClient\n\n\nclass ScientificOperationAuthTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.tmp=tempfile.TemporaryDirectory()\n        os.environ.pop("DATABASE_URL", None)\n        os.environ["CLEAR_NASDAQ_AUTH_STATE_DIR"]=cls.tmp.name\n        os.environ["CLEAR_NASDAQ_AUTH_SECRET"]="membership-signing-secret-abcdefghijklmnopqrstuvwxyz-123456"\n        os.environ["FIA_SCIENTIFIC_OPERATION_SECRET"]="science-secret-abcdefghijklmnopqrstuvwxyz-123456789"\n        import main\n        cls.main=main\n        from fia.auth_api import create_user, issue_session_token\n        user=create_user("Regression Member","member@example.test","Password12345")\n        cls.member_token=issue_session_token(user)\n        cls.client=TestClient(main.app)\n\n    @classmethod\n    def tearDownClass(cls):\n        cls.tmp.cleanup()\n\n    def setUp(self):\n        self.calls=0\n        async def fake_resolve(*args, **kwargs):\n            self.calls += 1\n            return 7\n        self.main.resolve_due_forward_records=fake_resolve\n        self.main.build_learning_status=lambda: {"ok":True,"records":0}\n\n    def test_missing_secret_refused(self):\n        r=self.client.post('/api/learning/resolve')\n        self.assertEqual(r.status_code,403)\n        self.assertEqual(r.json().get('detail'),'SCIENTIFIC_OPERATION_AUTH_REQUIRED')\n        self.assertEqual(self.calls,0)\n\n    def test_wrong_secret_refused_and_not_echoed(self):\n        wrong='wrong-scientific-secret-never-echo-123456789'\n        buf=io.StringIO()\n        with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):\n            r=self.client.post('/api/learning/resolve',headers={'x-fia-scientific-operation':wrong})\n        self.assertEqual(r.status_code,403)\n        self.assertEqual(r.json().get('detail'),'SCIENTIFIC_OPERATION_AUTH_FAILED')\n        self.assertNotIn(wrong,r.text)\n        self.assertNotIn(wrong,buf.getvalue())\n        self.assertEqual(self.calls,0)\n\n    def test_valid_scientific_secret_allowed(self):\n        secret=os.environ['FIA_SCIENTIFIC_OPERATION_SECRET']\n        r=self.client.post('/api/learning/resolve',headers={'x-fia-scientific-operation':secret})\n        self.assertEqual(r.status_code,200)\n        self.assertEqual(r.json().get('resolved_fields_updated'),7)\n        self.assertEqual(self.calls,1)\n\n    def test_membership_bearer_alone_insufficient(self):\n        r=self.client.post('/api/learning/resolve',headers={'authorization':'Bearer '+self.member_token})\n        self.assertEqual(r.status_code,403)\n        self.assertEqual(r.json().get('detail'),'SCIENTIFIC_OPERATION_AUTH_REQUIRED')\n        self.assertEqual(self.calls,0)\n\n    def test_learning_status_is_read_only_without_secret(self):\n        r=self.client.get('/api/learning/status')\n        self.assertEqual(r.status_code,200)\n        self.assertEqual(self.calls,0)\n\n    def test_health_read_only_unaffected(self):\n        r=self.client.get('/api/health')\n        self.assertEqual(r.status_code,200)\n        self.assertTrue(r.json().get('ok'))\n\n    def test_secret_not_in_generic_errors(self):\n        secret=os.environ['FIA_SCIENTIFIC_OPERATION_SECRET']\n        r=self.client.post('/api/learning/resolve')\n        self.assertNotIn(secret,r.text)\n\n\nif __name__ == '__main__':\n    unittest.main()\n''')
          PY

      - name: Compile touched backend modules
        run: |
          python -m py_compile \
            backend/main.py \
            backend/fia/auth_api.py \
            backend/fia/forward_oos_api.py \
            backend/fia/premove_api.py \
            backend/fia/premove_max_api.py \
            backend/fia/phase33_api.py \
            backend/fia/phase34_api.py \
            backend/fia_final_cockpit/api.py \
            backend/tests/test_scientific_operation_auth.py

      - name: Focused scientific auth regression
        working-directory: backend
        run: python -m unittest -v tests.test_scientific_operation_auth

      - name: Prove mutation inventory and frontend secret absence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          inventory={
            'STRICT_SCIENTIFIC_MUTATORS':[
              'POST /api/learning/resolve',
              'POST /api/forward-oos/run-once',
              'POST /api/forward-oos/durability/test-fixture (TEST-only; membership + science auth)',
              'DELETE /api/forward-oos/durability/test-fixture/{marker} (TEST-only; membership + science auth)',
            ],
            'READ_BY_DEFAULT_SCIENTIFIC_PERSISTENCE_OPTIONAL':[
              'GET /api/forecast','POST /api/confluence','GET /api/cognitive/forecast',
              'GET /api/premove','GET /api/premove/max','GET /api/phase33','GET /api/phase34',
              'POST /api/final/confluence/three-way',
            ],
            'INTERNAL_SERVER_MUTATOR':['Forward-OOS background worker -> run_once() (not an HTTP/browser credential path)'],
          }
          print('SCIENTIFIC_MUTATION_INVENTORY')
          for k,v in inventory.items():
              print(k)
              for x in v: print('  -',x)
          # Dedicated secret name/value must never be compiled into frontend code.
          hits=[]
          for p in Path('frontend').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.ts','.tsx','.js','.jsx','.json','.html','.css'}:
                  try: text=p.read_text(errors='ignore')
                  except Exception: continue
                  if 'FIA_SCIENTIFIC_OPERATION_SECRET' in text or 'x-fia-scientific-operation' in text:
                      hits.append(str(p))
          print('FRONTEND_SCIENTIFIC_SECRET_REFERENCES',hits)
          if hits: raise SystemExit(1)
          PY

      - name: Preserve scientific meaning and old V6 history
        shell: bash
        run: |
          set -euo pipefail
          BASE=975be163e9116dc54888af427f3889663f4f0a7a
          test -z "$(git diff --name-only "$BASE" -- backend/fia_forward_oos backend/fia_backtest_phase20/data 2>/dev/null || true)"
          python - <<'PY'
          import json, subprocess
          base='975be163e9116dc54888af427f3889663f4f0a7a'
          changed=subprocess.check_output(['git','diff','--name-only',base]).decode().splitlines()
          cls=json.load(open('backend/fia/identity_classification.json'))['classification']
          bad=[]
          for p in changed:
              rel=p[len('backend/'):] if p.startswith('backend/') else None
              if rel in cls and cls[rel] in {'MODEL','PROTOCOL'}:
                  bad.append((p,cls[rel]))
          print('CHANGED_FILES',changed)
          print('MODEL_OR_PROTOCOL_CHANGED',bad)
          if bad: raise SystemExit(1)
          PY

      - name: Prove identities after repair
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from fia.identity import all_fingerprints
          pre=json.load(open('/tmp/pre_identities.json'))
          d=all_fingerprints()
          post={k:d[k]['digest'] for k in ('model','protocol','infrastructure')}
          print('POST_IDENTITIES',json.dumps(post,sort_keys=True))
          print('MODEL_UNCHANGED',pre['model']==post['model'])
          print('PROTOCOL_UNCHANGED',pre['protocol']==post['protocol'])
          print('INFRA_CHANGED',pre['infrastructure']!=post['infrastructure'])
          if pre['model']!=post['model'] or pre['protocol']!=post['protocol']:
              raise SystemExit(1)
          json.dump(post,open('/tmp/post_identities.json','w'))
          PY

      - name: Commit repaired foundation when needed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/main.py backend/fia/auth_api.py backend/fia/forward_oos_api.py \
              backend/fia/premove_api.py backend/fia/premove_max_api.py backend/fia/phase33_api.py \
              backend/fia/phase34_api.py backend/fia_final_cockpit/api.py backend/tests/test_scientific_operation_auth.py
            git commit -m "Enforce scientific-operation mutation boundary"
            git push origin HEAD:fix/scientific-operation-auth-20260914
          else
            echo "No repair changes pending; validating final branch head."
          fi
