name: Baseline Manifest Repair

on:
  push:
    branches:
      - baseline-fia-gate-repair
    paths:
      - '.github/scripts/repair_release_manifest_v3.py'
      - '.github/workflows/baseline-manifest-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baseline-fia-gate-repair
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate truthful manifest revision 3
        run: python .github/scripts/repair_release_manifest_v3.py
      - name: Verify release manifest test before commit
        working-directory: backend
        run: python clear_nasdaq_brain/tests/test_release_manifest_v661.py
      - name: Commit only MANIFEST bookkeeping repair
        run: |
          set -euo pipefail
          git diff --exit-code -- backend/clear_nasdaq_brain/fia_brain/cloud_llm.py
          git diff --exit-code -- backend/fia backend/fia_forward_oos || true
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "backend/clear_nasdaq_brain/MANIFEST.json"
          git config user.name "CLEAR NASDAQ Baseline Gate Repair"
          git config user.email "clear-nasdaq@users.noreply.github.com"
          git add backend/clear_nasdaq_brain/MANIFEST.json
          git commit -m "Refresh hosted adapter release manifest identity"
          git push origin HEAD:baseline-fia-gate-repair
