name: FIA real Postgres and HTTP integration

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  postgres-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fia_test_v686
          POSTGRES_USER: fia_test
          POSTGRES_PASSWORD: test_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fia_test -d fia_test_v686"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      FIA_TEST_POSTGRES_DSN: postgresql://fia_test:test_only_disposable@127.0.0.1:5432/fia_test_v686
      FIA_TEST_OUTPUT_DIR: ${{ github.workspace }}/v686-test-results

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install actual application dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          import importlib.util
          missing = [m for m in ("fastapi", "uvicorn", "psycopg", "httpx", "pydantic")
                     if not importlib.util.find_spec(m)]
          print("MISSING:", missing or "none")
          raise SystemExit(1 if missing else 0)
          PY

      - name: Real Postgres transactions and exact-byte recovery
        id: pg
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p "$FIA_TEST_OUTPUT_DIR"
          python -m unittest fia.integration_forward_oos_postgres_v686 -v 2>&1 \
            | tee "$FIA_TEST_OUTPUT_DIR/postgres-v686.log"

      - name: Actual Uvicorn/FastAPI routes with isolated Postgres
        id: http
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          mkdir -p "$FIA_TEST_OUTPUT_DIR"
          python fia/integration_forward_oos_http_v686.py 2>&1 \
            | tee "$FIA_TEST_OUTPUT_DIR/http-v686.log"

      - name: Save integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fia-v686-real-postgres-http
          path: v686-test-results
          if-no-files-found: error

      - name: Final integration gate
        if: always()
        env:
          PG_OUTCOME: ${{ steps.pg.outcome }}
          HTTP_OUTCOME: ${{ steps.http.outcome }}
        run: |
          echo "Postgres transaction test: $PG_OUTCOME"
          echo "FastAPI/Uvicorn HTTP test: $HTTP_OUTCOME"
          if [ "$PG_OUTCOME" != "success" ] || [ "$HTTP_OUTCOME" != "success" ]; then
            echo "RESULT: FAIL — current branch has not proven both real integration gates"
            exit 1
          fi
          echo "RESULT: PASS — real disposable Postgres + actual HTTP gates green"
