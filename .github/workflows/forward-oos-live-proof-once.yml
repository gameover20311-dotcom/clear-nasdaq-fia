name: Forward-OOS live truth proof one-shot

on:
  push:
    branches:
      - fix/forward-oos-truth-status-20260914

permissions:
  contents: read

jobs:
  prove-live-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live public endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          BASE='https://clear-nasdaq-fia.onrender.com'
          for path in health forward-oos/campaign forward-oos/verify forward-oos/durability forward-oos/status; do
            out="proof/${path//\//_}.json"
            code=$(curl --fail-with-body --retry 4 --retry-delay 4 --connect-timeout 20 --max-time 90 -sS -w '%{http_code}' -o "$out" "$BASE/api/$path")
            echo "$path HTTP=$code"
            test "$code" = 200
            python -m json.tool "$out"
          done

      - name: Assert old campaign stays UNVERIFIED and storage is separate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path('proof/'+name).read_text())

          health = load('health.json')
          campaign = load('forward-oos_campaign.json')
          verify = load('forward-oos_verify.json')
          durability = load('forward-oos_durability.json')
          status = load('forward-oos_status.json')

          assert health.get('ok') is True, health
          assert campaign.get('ok') is False, campaign
          assert campaign.get('campaign_state') == 'UNVERIFIED', campaign
          assert campaign.get('scientific_verification') == 'FAIL', campaign
          assert campaign.get('eligible_for_scientific_counting') is False, campaign
          assert campaign.get('scientifically_countable_n') == 0, campaign
          assert campaign.get('forward_oos_n') == 0, campaign
          assert campaign.get('metrics_available') is False, campaign
          assert campaign.get('predictive_edge') == 'NOT_PROVEN', campaign

          issues = set(campaign.get('verification_issues') or []) | set(verify.get('issues') or [])
          assert any(str(x).startswith('missing_evidence_file:') for x in issues), issues
          assert 'missing_ledger_head_anchor' in issues, issues

          assert verify.get('ok') is False, verify
          assert durability.get('durability') == 'DURABLE', durability
          assert durability.get('scope') == 'STORAGE_ONLY_NOT_SCIENTIFIC_VERIFICATION', durability
          assert durability.get('scientific_artifacts_complete') is False, durability
          missing = set(durability.get('missing_scientific_artifacts') or [])
          assert any(str(x).startswith('evidence:') for x in missing), missing
          assert any(str(x).startswith('ledger_head:') for x in missing), missing

          truth = status.get('truth') or {}
          assert truth.get('campaign_state') == 'UNVERIFIED', status
          assert truth.get('scientifically_countable_n') == 0, status

          print('LIVE_PROOF_PASS')
          print('health_ok=', health.get('ok'))
          print('campaign_state=', campaign.get('campaign_state'))
          print('scientific_verification=', campaign.get('scientific_verification'))
          print('scientifically_countable_n=', campaign.get('scientifically_countable_n'))
          print('storage_state=', campaign.get('storage_state'))
          print('storage_scope=', durability.get('scope'))
          print('scientific_artifacts_complete=', durability.get('scientific_artifacts_complete'))
          print('verification_issues=', sorted(issues))
          print('predictive_edge=', campaign.get('predictive_edge'))
          PY

      - name: Build proof manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, datetime
          files={}
          for p in sorted(Path('proof').glob('*.json')):
              b=p.read_bytes(); files[p.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          manifest={
            'captured_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'live_base':'https://clear-nasdaq-fia.onrender.com',
            'production_commit':'975be163e9116dc54888af427f3889663f4f0a7a',
            'render_deploy':'dep-daji90ek1f9s73fsj4n0',
            'files':files,
            'claim':'Storage durability is separate from scientific verification; old V6 remains UNVERIFIED.'
          }
          Path('proof/PROOF_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CLEAR_NASDAQ_FORWARD_OOS_LIVE_TRUTH_PROOF_20260914
          path: proof/
          if-no-files-found: error
          retention-days: 30
