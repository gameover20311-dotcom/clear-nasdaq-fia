name: Live production verification

on:
  push:
    branches:
      - fix/live-degraded-20260908

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live backend truth endpoints
        shell: bash
        run: |
          set -u
          BASE=https://clear-nasdaq-fia.onrender.com
          echo '=== HEALTH ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/health" || true
          echo '=== PROVIDER HEALTH ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/provider/health" || true
          echo '=== DASHBOARD ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/dashboard" || true
          echo '=== COGNITIVE STATUS ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/cognitive/status" || true
          echo '=== FOOS STATUS ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/forward-oos/status" || true
          echo '=== FOOS VERIFY ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/forward-oos/verify" || true
          echo '=== FOOS DURABILITY ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/forward-oos/durability" || true
          echo '=== FOOS CAMPAIGN ==='
          curl -sS --max-time 90 -w '\nHTTP=%{http_code}\n' "$BASE/api/forward-oos/campaign" || true
