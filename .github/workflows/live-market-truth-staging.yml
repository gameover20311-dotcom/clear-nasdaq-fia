name: live-market-truth-staging

on:
  push:
    branches:
      - fix/live-market-truth-20260909
  workflow_dispatch:

jobs:
  truth-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile staged truth modules
        run: python -m py_compile fia/live_market_truth.py fia/official_macro_fallback.py fia/__init__.py fia/providers.py fia/engine.py fia/forward_oos.py
      - name: Run staged truth regressions
        run: python -m unittest discover -s tests -p 'test_*market_truth*.py' -v
      - name: Live official macro source smoke test
        run: |
          python - <<'PY'
          import asyncio
          from fia.official_macro_fallback import build_official_macro_calendar
          result = asyncio.run(build_official_macro_calendar())
          print('official macro states:', result['source_states'])
          print('official macro events:', result['event_count'])
          assert result['available'] is True, result
          assert any(v == 'LIVE' for v in result['source_states'].values()), result
          PY
      - name: Prove production seal policy is untouched on staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          seal = json.loads(Path('fia_forward_oos/FORWARD_OOS_CAMPAIGN_SEAL.json').read_text())
          assert seal['campaign_id'] == 'CLEAR-NASDAQ-FORWARD-OOS-V6-V672'
          assert seal['forecast_edit_or_delete_allowed'] is False
          assert seal['historical_tuning_after_seal_allowed'] is False
          print('campaign policy preserved:', seal['campaign_id'])
          PY
