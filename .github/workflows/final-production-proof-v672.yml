name: Final production proof v672

on:
  push:
    branches:
      - fix/final-live-news-freshness-20260908

permissions:
  contents: read

jobs:
  prove-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed production after final incident fix
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://clear-nasdaq-fia.onrender.com'
          mkdir -p /tmp/final_live
          for p in /api/health /api/provider/health /api/dashboard /api/forward-oos/status /api/forward-oos/verify /api/forward-oos/durability /api/forward-oos/campaign; do
            n=$(printf '%s' "$p" | tr '/-' '__')
            code=$(curl -sS --max-time 120 -o "/tmp/final_live/${n}.json" -w '%{http_code}' "$BASE$p")
            echo "$p HTTP=$code"
            test "$code" = 200
          done
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/final_live')
          def load(endpoint):
              return json.loads((root/(endpoint.replace('/','_').replace('-','_')+'.json')).read_text())
          health=load('/api/health')
          ph=load('/api/provider/health')
          dash=load('/api/dashboard')
          status=load('/api/forward-oos/status')
          verify=load('/api/forward-oos/verify')
          durable=load('/api/forward-oos/durability')
          campaign=load('/api/forward-oos/campaign')
          live=dash.get('live') or {}
          data=(live.get('snapshot') or {}).get('data') or {}
          cog=live.get('cognitive') or {}
          specs={s.get('name'):s for s in (cog.get('specialists') or []) if isinstance(s,dict)}
          news=(ph.get('source_health') or {}).get('news') or (data.get('source_health') or {}).get('news') or {}
          pm=live.get('premove_watch') or {}
          h=pm.get('horizons') or {}
          out={
              'health_ok':health.get('ok'),
              'provider_overall':(ph.get('provider_health') or {}).get('overall'),
              'provider_score':(ph.get('provider_health') or {}).get('score'),
              'news_status':data.get('news_status'),
              'news_provider_selected':data.get('news_provider_selected'),
              'news_articles':data.get('news_articles'),
              'news_scored_articles':data.get('news_scored_articles'),
              'news_newest_age_seconds':data.get('news_newest_article_age_seconds'),
              'news_source_health_status':news.get('status'),
              'news_source_health_source':news.get('source'),
              'news_event_ai':{k:(specs.get('News Event AI') or {}).get(k) for k in ('direction','score','reliability','missing_reason')},
              'intelligence_coverage':cog.get('intelligence_coverage'),
              'reliability':cog.get('reliability'),
              '4h':{k:(h.get('4h') or {}).get(k) for k in ('state','direction','bullish_probability','bearish_probability','confidence','actionable','no_edge_reason')},
              '8h':{k:(h.get('8h') or {}).get(k) for k in ('state','direction','bullish_probability','bearish_probability','confidence','actionable','no_edge_reason')},
              'campaign_id':campaign.get('campaign_id'),
              'campaign_n':campaign.get('forward_oos_n'),
              'campaign_directional_n':campaign.get('directional_n'),
              'campaign_abstention_n':campaign.get('abstention_n'),
              'campaign_fingerprint':campaign.get('model_fingerprint'),
              'predictive_edge':campaign.get('predictive_edge'),
              'ledger_ok':(status.get('ledger') or {}).get('ok'),
              'ledger_events':(status.get('ledger') or {}).get('events'),
              'forecast_locks':(status.get('ledger') or {}).get('forecast_locks'),
              'verify_ok':verify.get('ok'),
              'durable':durable.get('durable'),
              'durable_backend':durable.get('backend'),
          }
          print('FINAL_LIVE_PROOF=' + json.dumps(out, sort_keys=True))
          assert health.get('ok') is True
          assert (ph.get('provider_health') or {}).get('overall') == 'LIVE'
          assert verify.get('ok') is True
          assert durable.get('durable') is True and durable.get('backend') == 'postgres'
          assert campaign.get('campaign_id') == 'CLEAR-NASDAQ-FORWARD-OOS-V6-V672', campaign
          assert campaign.get('forward_oos_n') == 0, campaign
          assert (status.get('ledger') or {}).get('events') == 0, status
          assert (status.get('ledger') or {}).get('forecast_locks') == 0, status
          assert data.get('news_provider_selected') in ('NewsAPI','Finnhub'), data.get('news_provider_selected')
          age=data.get('news_newest_article_age_seconds')
          assert age is not None and 0 <= float(age) <= 43200.0, age
          assert str(data.get('news_status') or '').startswith('live'), data.get('news_status')
          assert news.get('status') != 'stale', news
          if int(data.get('news_scored_articles') or 0) > 0:
              assert (specs.get('News Event AI') or {}).get('direction') != 'MISSING', specs.get('News Event AI')
          print('FINAL_PRODUCTION_V672=PASS')
          PY
