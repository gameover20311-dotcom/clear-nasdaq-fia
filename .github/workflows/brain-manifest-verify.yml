name: Brain Manifest Verify

on:
  push:
    branches: ["**"]
    paths:
      - 'backend/clear_nasdaq_brain/**'
      - '.github/scripts/brain_manifest_audit.py'
      - '.github/workflows/brain-manifest-verify.yml'
  pull_request:
    paths:
      - 'backend/clear_nasdaq_brain/**'
      - '.github/scripts/brain_manifest_audit.py'
      - '.github/workflows/brain-manifest-verify.yml'

permissions:
  contents: read

jobs:
  verify-brain-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit manifest against exact payload
        run: python .github/scripts/brain_manifest_audit.py
      - name: Run release manifest regression
        working-directory: backend
        run: python clear_nasdaq_brain/tests/test_release_manifest_v661.py
