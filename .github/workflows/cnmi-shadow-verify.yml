name: CNMI Shadow Verify

on:
  push:
    branches: ["**"]
    paths:
      - 'research/cnmi_shadow/**'
      - 'backend/main.py'
      - 'backend/fia/**'
      - 'backend/fia_final_cockpit/**'
      - 'CNMI_SHADOW_INTEGRATION.md'
      - '.github/scripts/production_isolation_gate.py'
      - '.github/workflows/cnmi-shadow-verify.yml'
  pull_request:
    paths:
      - 'research/cnmi_shadow/**'
      - 'backend/main.py'
      - 'backend/fia/**'
      - 'backend/fia_final_cockpit/**'
      - 'CNMI_SHADOW_INTEGRATION.md'
      - '.github/scripts/production_isolation_gate.py'
      - '.github/workflows/cnmi-shadow-verify.yml'

permissions:
  contents: read

jobs:
  verify-cnmi-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile adapter, regression, mutation and boundary gate
        run: |
          python -m py_compile \
            research/cnmi_shadow/adapter.py \
            research/cnmi_shadow/test_adapter.py \
            research/cnmi_shadow/mutation_probe.py \
            .github/scripts/production_isolation_gate.py

      - name: Run hostile shadow regression
        run: |
          python -m unittest discover -s research/cnmi_shadow -p 'test_adapter.py' -v

      - name: Kill targeted fail-open mutations
        run: |
          python -m research.cnmi_shadow.mutation_probe

      - name: Attack production-isolation verifier itself
        run: |
          python .github/scripts/production_isolation_gate.py --self-test

      - name: Scan full declared production surface for hidden shadow influence
        run: |
          python .github/scripts/production_isolation_gate.py

      - name: Verify production boundary literals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/cnmi_shadow/adapter.py')
          text = p.read_text(encoding='utf-8')
          required = [
              'PRODUCTION_INFLUENCE = False',
              'DEPLOYMENT_AUTHORIZED = False',
              'PREDICTIVE_EDGE_CLAIMED = False',
              'CNMI_NATIVE_105_34_10 = "NOT_CLAIMED"',
              'EXTERNAL_PRODUCTION_VERIFIER_BOUND = False',
              'production_ok = False',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('CNMI shadow boundary missing: ' + repr(missing))
          forbidden = [
              'from fia.engine import',
              'from fia.forward_oos import',
              'record_forward_forecast(',
              'build_forecast(',
          ]
          found = [x for x in forbidden if x in text]
          if found:
              raise SystemExit('CNMI shadow crossed production boundary: ' + repr(found))
          print('CNMI_SHADOW_PRODUCTION_BOUNDARY=PASS')
          PY

      - name: Verify backend scientific identity scope untouched
        run: |
          test ! -e backend/fia/cnmi_shadow.py
          test ! -e backend/tests/test_cnmi_shadow.py
          echo 'CNMI_SHADOW_OUTSIDE_BACKEND_FINGERPRINT_SCOPE=PASS'
