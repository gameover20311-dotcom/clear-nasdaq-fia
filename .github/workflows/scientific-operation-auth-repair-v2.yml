name: Scientific operation auth repair v2

on:
  push:
    branches:
      - fix/scientific-operation-auth-20260914

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture pre-repair identities
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from fia.identity import all_fingerprints
          d=all_fingerprints()
          out={k:d[k]['digest'] for k in ('model','protocol','infrastructure')}
          print('PRE_IDENTITIES', json.dumps(out, sort_keys=True))
          json.dump(out, open('/tmp/pre_identities.json','w'))
          PY

      - name: Apply one scientific-operation boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s:
                  return False
              if old not in s:
                  raise SystemExit(f'locator not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))
              return True

          def replace_block(path, start, end, new):
              p=Path(path); s=p.read_text()
              if new.strip() in s:
                  return False
              a=s.find(start)
              if a < 0:
                  raise SystemExit(f'start locator not found in {path}: {start}')
              b=s.find(end,a+len(start)) if end is not None else len(s)
              if b < 0:
                  raise SystemExit(f'end locator not found in {path}: {end}')
              p.write_text(s[:a] + new.rstrip() + '\n\n\n' + s[b:])
              return True

