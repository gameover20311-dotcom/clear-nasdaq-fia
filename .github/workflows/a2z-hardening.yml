name: a2z-hardening

on:
  push:
    branches:
      - fix/a2z-hardening-20260909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Apply deterministic source patches
        run: python .github/scripts/apply_a2z_text_patches.py
      - name: Refresh release manifest from current bytes
        run: python .github/scripts/refresh_brain_manifest.py
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile hardened modules
        working-directory: backend
        run: |
          python -m py_compile \
            main.py \
            fia/provider_guard.py \
            fia/oos_guard.py \
            fia/live_market_truth.py \
            fia/official_macro_fallback.py \
            fia/forward_oos_api.py
      - name: Run Top-5 hardening regressions
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_a2z_hardening.py' -v
      - name: Re-run market-truth regressions
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*market_truth*.py' -v
      - name: Prove the three original audit failures are repaired
        working-directory: backend
        run: |
          python clear_nasdaq_brain/tests/test_release_manifest_v661.py
          python clear_nasdaq_brain/tests/test_structured_output_wiring_v6_5.py
          python fia/test_freeze_parity_v667.py
      - name: Import production API
        working-directory: backend
        run: python -c "import main; assert any(getattr(r, 'path', '') == '/api/health' for r in main.app.routes)"
      - name: Commit deterministic repairs only after tests pass
        run: |
          if ! git diff --quiet; then
            git config user.name "clear-nasdaq-a2z-bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              backend/main.py \
              backend/fia/forward_oos_api.py \
              backend/fia/test_freeze_parity_v667.py \
              backend/fia/test_session_abstention_v665.py \
              backend/fia_forward_oos/test_forward_oos_integrity.py \
              backend/fia_forward_oos/V2_PRELIVE_ARCHIVE_20260903_065357/test_forward_oos_integrity.py \
              backend/clear_nasdaq_brain/MANIFEST.json
            git commit -m "Repair remaining A2Z audit regressions"
            git push origin HEAD:fix/a2z-hardening-20260909
          fi
