name: Baseline Manifest Probe

on:
  push:
    branches:
      - baseline-fia-gate-repair
    paths:
      - '.github/scripts/baseline_manifest_probe.py'
      - '.github/workflows/baseline-manifest-probe.yml'
      - 'backend/clear_nasdaq_brain/**'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print exact release identity bytes
        run: python .github/scripts/baseline_manifest_probe.py
