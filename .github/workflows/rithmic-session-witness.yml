name: Rithmic Session Witness

on:
  push:
    branches:
      - rithmic-test-live-smoke-20260915
    paths:
      - '.github/workflows/rithmic-session-witness.yml'
      - 'rithmic_witness_heartbeat.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rithmic-session-witness-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Freeze witness contract
        shell: bash
        run: |
          set -euo pipefail
          echo 'WITNESS_POLICY=RITHMIC_EXTERNAL_WITNESS_V1'
          echo 'TARGET=https://rithmic-test-smoke-20260915.onrender.com'
          echo 'INTERVAL_SECONDS=300'
          echo 'MAX_ITERATIONS=68'
          echo 'RULE=Any HTTP/JSON failure is evidence of a continuity defect; never reinterpret as PASS.'

      - name: Witness collector continuously
        shell: bash
        env:
          TARGET: https://rithmic-test-smoke-20260915.onrender.com
        run: |
          set -uo pipefail
          failures=0
          previous_boot=''

          contract=$(curl --fail --silent --show-error --max-time 30 "$TARGET/collector/proof-contract") || {
            echo 'WITNESS_PROOF_CONTRACT_HTTP_FAIL'
            exit 1
          }
          echo "$contract" | jq -e '.continuity_fail_closed == true and .scope == "SHADOW_ONLY"' >/dev/null || {
            echo 'WITNESS_PROOF_CONTRACT_INVALID'
            exit 1
          }
          echo "WITNESS_PROOF_CONTRACT=$contract"

          for i in $(seq 1 68); do
            requested=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            body=$(curl --fail --silent --show-error --max-time 30 "$TARGET/collector/status")
            rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$body" ]; then
              echo "WITNESS_HTTP_FAIL index=$i requested_utc=$requested curl_rc=$rc"
              failures=$((failures+1))
            elif ! echo "$body" | jq -e '
              has("boot_id") and
              has("observed_utc") and
              has("phase") and
              has("collector_task_running") and
              has("checkpoint_count") and
              has("previous_checkpoint_sha256") and
              has("health") and
              has("connection_attempts") and
              has("successful_connections") and
              has("hard_failures") and
              (.collector_task_running == true)
            ' >/dev/null; then
              echo "WITNESS_JSON_OR_CONTRACT_FAIL index=$i requested_utc=$requested"
              failures=$((failures+1))
            else
              boot=$(echo "$body" | jq -r '.boot_id')
              observed=$(echo "$body" | jq -r '.observed_utc')
              phase=$(echo "$body" | jq -r '.phase')
              checkpoint_count=$(echo "$body" | jq -r '.checkpoint_count')
              checkpoint_sha=$(echo "$body" | jq -r '.previous_checkpoint_sha256')
              connected=$(echo "$body" | jq -r '.health.connected')
              capability=$(echo "$body" | jq -r '.health.capability')
              attempts=$(echo "$body" | jq -r '.connection_attempts')
              successes=$(echo "$body" | jq -r '.successful_connections')
              hard_failures=$(echo "$body" | jq -c '.hard_failures')
              response_sha=$(printf '%s' "$body" | sha256sum | awk '{print $1}')

              boot_changed=false
              if [ -n "$previous_boot" ] && [ "$previous_boot" != "$boot" ]; then
                boot_changed=true
                failures=$((failures+1))
              fi
              previous_boot="$boot"

              echo "WITNESS_CHECK index=$i requested_utc=$requested observed_utc=$observed boot_id=$boot boot_changed=$boot_changed checkpoint_count=$checkpoint_count checkpoint_sha=$checkpoint_sha connected=$connected capability=$capability connection_attempts=$attempts successful_connections=$successes hard_failures=$hard_failures response_sha256=$response_sha phase=$phase"
            fi

            if [ "$i" -lt 68 ]; then
              sleep 300
            fi
          done

          echo "WITNESS_SUMMARY failures=$failures"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
