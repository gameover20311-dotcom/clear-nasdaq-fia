name: Controlled Stage 4 MBO
on:
  push:
    branches: [feat/final-controlled-integration-20260914]
permissions:
  contents: write
jobs:
  mbo:
    if: github.event.head_commit.message == 'Run controlled Stage 4 MBO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch exact provider-neutral NQ MBO adapter source
        run: |
          git fetch origin feat/real-nq-mbo-adapter-20260913
          git cat-file -e 85a3c0b297839ca1e12089cdb44ab699e626528f^{commit}
          git checkout 85a3c0b297839ca1e12089cdb44ab699e626528f -- backend/nq_mbo_adapter
      - name: Verify adapter and Rithmic fail-closed boundary
        working-directory: backend
        run: |
          python -m unittest discover -v -s nq_mbo_adapter/tests -p 'test_*.py'
          python - <<'PY'
          import asyncio
          from nq_mbo_adapter.rithmic import RithmicAdapter
          a=RithmicAdapter()
          h=a.health()
          assert h.status=='AWAITING_VENDOR_CONTRACT', h
          caps=a.capabilities()
          assert caps.individual_order_identity is False
          assert caps.sequence_semantics is False
          assert caps.add_modify_cancel_semantics is False
          try:
              asyncio.run(a.connect())
          except RuntimeError as exc:
              assert str(exc)=='RITHMIC_VENDOR_CONTRACT_NOT_BOUND', repr(exc)
          else:
              raise AssertionError('unbound Rithmic adapter connected unexpectedly')
          print('CME_MBO_ADAPTER_BOUNDARY=PASS')
          print('REAL_MBO_DATA_CONNECTED=NO')
          print('ENTITLEMENT_STATUS=NOT_VERIFIED_FOR_API_TRUE_MBO')
          print('HISTORICAL_MBO_AVAILABLE=NOT_VERIFIED')
          print('REALTIME_MBO_AVAILABLE=NOT_VERIFIED')
          PY
      - name: Prove DPCSE remains NOT_ARMED and BASE/old FOOS unchanged
        working-directory: backend
        run: |
          python - <<'PY'
          from fia.identity import all_fingerprints
          from dpcse_v23_shadow.campaign import bootstrap_manifest
          expected={'model':'91e5d9a67625171c384dfcd6edb9bc36586a687dddb7ae7c5c54d194ce3da863','protocol':'f28842b437ffcd76c9702c15ef2bc072a0ead1e08ff3c5590cef2f61278245cc','infrastructure':'1b01dbf4c3458d7cbcc96cb30d7a854ecc95a8b4fe16d54bacb9382ed4a41054'}
          d=all_fingerprints(); got={k:d[k]['digest'] for k in expected}; assert got==expected,(got,expected)
          m=bootstrap_manifest(); assert m['status']=='NOT_ARMED' and m['locked_rows']==0 and m['resolved_rows']==0 and m['candidate_model'] is None
          print('BASE_FIA_UNCHANGED=PASS')
          print('DPCSE_PRODUCTION_AUTHORITY=false')
          PY
          cd ..
          test -z "$(git diff --name-only 982930c2f87ec70d46b4bac813068f77868df804 -- backend/fia_forward_oos backend/fia_backtest_phase14/data backend/fia_backtest_phase20/data)"
          echo OLD_FORWARD_OOS_UNCHANGED=PASS
      - name: Commit Stage 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/nq_mbo_adapter
          git commit -m 'Integrate NQ MBO adapter boundary without claiming live data'
          git push origin HEAD:feat/final-controlled-integration-20260914
