name: Forward-OOS truth repair v3

on:
  push:
    branches:
      - fix/forward-oos-truth-status-20260914

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply repair with structural locators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, textwrap

          wf = Path('.github/workflows/forward-oos-truth-repair-once.yml').read_text()
          sm = "          python - <<'PY'\n"
          em = "\n          PY\n\n      - name: Install focused runtime dependencies"
          a = wf.index(sm) + len(sm)
          b = wf.index(em, a)
          body = textwrap.dedent(wf[a:b])
          for name in ('new_status','new_mirror_event','new_restore','new_restore_hook','new_write_evidence','campaign_route'):
              body = re.sub(
                  r"re\.subn\((r'.*?'), " + re.escape(name) + r",",
                  lambda m, n=name: "re.subn(" + m.group(1) + ", lambda _m: " + n + ",",
                  body,
              )
          exec(compile(body, '<truth-repair>', 'exec'), {})

          # This repair must not change the core scientific/prediction file.
          subprocess.run(['git','checkout','origin/main','--','backend/fia/forward_oos.py'], check=True)

          durable = Path('backend/fia/forward_oos_durable.py')
          s = durable.read_text()
          if 'import hashlib\n' not in s:
              s = s.replace('import json\nimport os\n', 'import hashlib\nimport json\nimport os\n', 1)

          prep = '''head_blob = head_path.read_bytes()
          head_obj = json.loads(head_blob.decode("utf-8"))

          # A FORECAST_LOCK is scientifically recoverable only if its exact
          # pre-move evidence bytes are durable too. Missing old evidence is
          # never reconstructed or synthesized.
          evidence_blob = None
          evidence_file = None
          evidence_digest = None
          if str(event.get("event_type") or "") == "FORECAST_LOCK":
              meta = ((event.get("payload") or {}).get("evidence") or {})
              evidence_file = str(meta.get("path") or "")
              evidence_digest = str(meta.get("sha256") or "")
              if (not evidence_file or not evidence_digest
                      or not _EVIDENCE_FILE_RE.match(evidence_file)):
                  raise RuntimeError("FORECAST_LOCK_EVIDENCE_REFERENCE_INVALID")
              evidence_path = root / evidence_file
              if not evidence_path.exists():
                  raise RuntimeError("FORECAST_LOCK_EVIDENCE_FILE_MISSING")
              evidence_blob = evidence_path.read_bytes()
              if hashlib.sha256(evidence_blob).hexdigest() != evidence_digest:
                  raise RuntimeError("FORECAST_LOCK_EVIDENCE_HASH_MISMATCH")

          with _connect() as conn:'''
          pat = re.compile(
              r'(?P<i> +)head_blob = head_path\.read_bytes\(\)\n'
              r'(?P=i)head_obj = json\.loads\(head_blob\.decode\("utf-8"\)\)\n'
              r'(?P=i)with _connect\(\) as conn:'
          )
          def repl_prep(m):
              i=m.group('i')
              return '\n'.join(i + line if line else '' for line in prep.splitlines())
          s, n = pat.subn(repl_prep, s, count=1)
          if n != 1: raise SystemExit('structural evidence preparation locator failed')

          insert = '''file_name, canonical, bool(is_test)))
          if evidence_blob is not None:
              cur.execute(
                  "INSERT INTO forward_oos_evidence "
                  "(campaign_id, forecast_id, file_name, sha256, canonical_json) "
                  "VALUES (%s,%s,%s,%s,%s) "
                  "ON CONFLICT (campaign_id, forecast_id) DO NOTHING",
                  (cid, str(event.get("forecast_id") or ""), evidence_file,
                   evidence_digest, evidence_blob))
              cur.execute(
                  "SELECT file_name, sha256, canonical_json FROM forward_oos_evidence "
                  "WHERE campaign_id=%s AND forecast_id=%s",
                  (cid, str(event.get("forecast_id") or "")))
              ev = cur.fetchone() or {}
              if (str(ev.get("file_name") or "") != evidence_file
                      or str(ev.get("sha256") or "") != evidence_digest
                      or bytes(ev.get("canonical_json") or b"") != evidence_blob):
                  raise RuntimeError("EVIDENCE_MIRROR_CONFLICT")
          if not is_test:'''
          pat2 = re.compile(
              r'(?P<i> +)file_name, canonical, bool\(is_test\)\)\)\n'
              r'(?P<j> +)if not is_test:'
          )
          def repl_insert(m):
              # The first line belongs to the event execute continuation; following
              # statements belong at the same indent as the original if-not-test.
              i,j=m.group('i'),m.group('j')
              lines=insert.splitlines()
              out=[i+lines[0]]
              for line in lines[1:]:
                  # source template uses 10-space logical indentation units
                  stripped=line.lstrip(' ')
                  rel=(len(line)-len(stripped))
                  out.append(j + (' ' * rel) + stripped)
              return '\n'.join(out)
          s, n = pat2.subn(repl_insert, s, count=1)
          if n != 1: raise SystemExit('structural evidence transaction locator failed')
          durable.write_text(s)

          api=Path('backend/fia/forward_oos_api.py')
          s=api.read_text()
          pat3=re.compile(
              r'(?P<i> +)async def startup\(\) -> None:\n'
              r'(?P<j> +)if not _enabled\(\):\n'
              r'(?P<k> +)return\n'
              r'(?P=j)existing: Optional\[asyncio\.Task\] = getattr\(app\.state, "forward_oos_task", None\)'
          )
          def repl_start(m):
              return (m.group('i')+'async def startup() -> None:\n'+
                      m.group('j')+'if not _enabled():\n'+m.group('k')+'return\n'+
                      m.group('j')+'# Restore only exact mirrored artifacts before verification.\n'+
                      m.group('j')+'from fia.forward_oos_durable import restore_missing\n'+
                      m.group('j')+'restore_missing(DEFAULT_ROOT)\n'+
                      m.group('j')+'existing: Optional[asyncio.Task] = getattr(app.state, "forward_oos_task", None)')
          s,n=pat3.subn(repl_start,s,count=1)
          if n != 1: raise SystemExit('structural startup locator failed')
          api.write_text(s)
          PY

      - name: Prove scientific core file unchanged
        run: git diff --exit-code origin/main -- backend/fia/forward_oos.py

      - name: Install focused dependencies
        run: python -m pip install -q fastapi 'psycopg[binary]'

      - name: Compile
        run: python -m py_compile backend/fia/forward_oos.py backend/fia/forward_oos_durable.py backend/fia/forward_oos_api.py backend/fia/test_forward_oos_truth_status_v683.py

      - name: Focused regressions
        run: |
          python backend/fia/test_forward_oos_durable_v668.py
          python backend/fia/test_forward_oos_truth_status_v683.py
          python backend/fia/test_evidence_truth_v667.py

      - name: Source assertions
        run: |
          grep -q 'STORAGE_ONLY_NOT_SCIENTIFIC_VERIFICATION' backend/fia/forward_oos_durable.py
          grep -q 'FORECAST_LOCK_EVIDENCE_HASH_MISMATCH' backend/fia/forward_oos_durable.py
          grep -q 'forward_oos_ledger_heads' backend/fia/forward_oos_durable.py
          grep -q 'scientifically_countable_n' backend/fia/forward_oos_api.py
          grep -q 'restore_missing(DEFAULT_ROOT)' backend/fia/forward_oos_api.py

      - name: Commit tested repair
        shell: bash
        run: |
          rm -f .github/workflows/forward-oos-truth-repair-once.yml .github/workflows/forward-oos-truth-repair-v2.yml .github/workflows/forward-oos-truth-repair-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fail closed Forward-OOS storage versus scientific proof'
          git push origin HEAD:fix/forward-oos-truth-status-20260914
