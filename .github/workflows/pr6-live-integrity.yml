name: PR6 isolated integrity checks

on:
  push:
    branches: [fix/live-integrity-20260911]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  postgres-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fia_test_pr6
          POSTGRES_USER: fia_test
          POSTGRES_PASSWORD: test_only_disposable
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fia_test -d fia_test_pr6"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FIA_TEST_POSTGRES_DSN: postgresql://fia_test:test_only_disposable@127.0.0.1:5432/fia_test_pr6
      FIA_TEST_OUTPUT_DIR: ${{ github.workspace }}/pr6-test-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install actual application dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Local repair regressions and offline provenance fixtures
        working-directory: backend
        run: |
          mkdir -p "$FIA_TEST_OUTPUT_DIR"
          python -m unittest fia.test_live_integrity_v673 -v 2>&1 | tee "$FIA_TEST_OUTPUT_DIR/local-integrity-tests.log"
          python fia/test_candle_fallback_cloud.py 2>&1 | tee "$FIA_TEST_OUTPUT_DIR/candle-provenance-tests.log"
          python fia/test_evidence_truth_v667.py 2>&1 | tee "$FIA_TEST_OUTPUT_DIR/evidence-truth-tests.log"
      - name: Native Postgres transactions and recovery
        working-directory: backend
        run: |
          mkdir -p "$FIA_TEST_OUTPUT_DIR"
          python -m unittest fia.test_live_integrity_postgres_v673 -v 2>&1 | tee "$FIA_TEST_OUTPUT_DIR/postgres-tests.log"
      - name: Actual FastAPI HTTP with isolated Postgres
        if: ${{ !cancelled() }}
        working-directory: backend
        run: python fia/test_live_integrity_app_v673.py
      - name: All existing active regressions in disposable project copy
        if: ${{ !cancelled() }}
        run: python backend/fia/run_existing_integrity_regressions.py --output "$FIA_TEST_OUTPUT_DIR/existing-regressions"
      - name: Read unchanged production baseline for failed-gate comparison
        if: ${{ !cancelled() }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ebaadf876e5e78ce6ced2b99936aa3eac209d588
          path: pr6-baseline
          persist-credentials: false
      - name: Compare remaining failed gates against production baseline
        if: ${{ !cancelled() }}
        run: python backend/fia/run_existing_integrity_regressions.py --source-tree pr6-baseline --failure-list "$FIA_TEST_OUTPUT_DIR/existing-regressions/results.json" --output "$FIA_TEST_OUTPUT_DIR/baseline-failed-gates"
      - name: Save real test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-real-integrity-evidence
          path: pr6-test-results
          if-no-files-found: error
